name: Test

# One responsibility: run the suites. The Release chain calls this workflow as
# the gate before Version tags the pushed commit, and pull requests call it
# directly. A push to main starts Release, not Test, so the suites run once.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The package has no runtime dependencies; the suites need this harness.
      - name: Install test harness
        run: npm install --no-save --no-package-lock react@18 react-dom@18 jsdom
      # live.test.mjs probes a live audio.cpp/Ollama on the author's LAN, so it
      # stays out of CI; its checks skip themselves when those engines are absent.
      - name: Test
        env:
          NODE_ENV: development
        run: node --test test/client.test.mjs test/core.test.mjs test/host.test.mjs test/bundle.test.mjs
