name: Version

# One responsibility: tag the version the pushed commit already carries. The
# bump is local — .githooks/pre-commit updates the manifest before the commit —
# so nothing here decides, commits or pushes a version. This workflow is called
# by release.yml, which chains the publish job on its outputs.
on:
  workflow_call:
    outputs:
      tag:
        description: The version tag on the pushed commit
        value: ${{ jobs.version.outputs.tag }}
      created:
        description: Whether this run created the tag
        value: ${{ jobs.version.outputs.created }}

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  version:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.manifest.outputs.tag }}
      created: ${{ steps.tag.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read the manifest version
        id: manifest
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
      - name: Tag
        id: tag
        env:
          TAG: ${{ steps.manifest.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "${TAG} exists already; nothing to tag"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"
          echo "created=true" >> "$GITHUB_OUTPUT"
