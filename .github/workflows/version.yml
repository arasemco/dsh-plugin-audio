name: Version

# One responsibility: tag the version the pushed commit already carries. The
# bump is local — .githooks/pre-commit updates the manifest before the commit —
# so nothing here decides, commits or pushes a version. This workflow only
# creates the annotated tag; release.yml publishes it, because a tag pushed with
# GITHUB_TOKEN emits no event of its own.
on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  version:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read the manifest version
        id: manifest
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
      - name: Tag
        env:
          TAG: ${{ steps.manifest.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "${TAG} exists already; nothing to tag"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"
