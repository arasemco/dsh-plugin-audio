name: Release

# The entry workflow, and the chain: release.yml → version.yml → test.yml, each
# gated by needs. One trigger here, the other two workflows are workflow_call
# only. version.yml tags the commit that already carries the locally bumped
# manifest; then this workflow publishes that tag.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    uses: ./.github/workflows/version.yml
    permissions:
      contents: write

  release:
    needs: version
    if: needs.version.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build tarball
        run: npm pack
      - name: Record tarball SHA-256
        run: |
          echo '### Tarball SHA-256' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          sha256sum *.tgz >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sha256sum *.tgz
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: '*.tgz'
