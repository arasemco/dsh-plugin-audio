name: Release

# The entry workflow and the chain: release.yml → version.yml → test.yml. On a
# push to main, version.yml runs the test workflow, tags the commit that already
# carries the locally bumped manifest, and hands the tag back; this workflow
# then publishes it. Pull requests only run test.yml. The release itself is
# created through the API (Gitea's included), since the marketplace release
# actions target GitHub's.
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    uses: ./.github/workflows/version.yml
    permissions:
      contents: write

  release:
    needs: version
    if: needs.version.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build tarball
        run: npm pack
      - name: Record tarball SHA-256
        run: |
          echo '### Tarball SHA-256' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          sha256sum *.tgz >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sha256sum *.tgz
      - name: Create release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL:-https://git.omesa.net/api/v1}/repos/${GITHUB_REPOSITORY}"
          id="$(curl -sS -X POST -H "Authorization: token ${TOKEN}" -H 'content-type: application/json' \
            "${api}/releases" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"body\":\"Release ${TAG}\",\"draft\":false,\"prerelease\":false}" \
            | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')"
          for file in *.tgz; do
            curl -sS -X POST -H "Authorization: token ${TOKEN}" \
              "${api}/releases/${id}/assets?name=$(basename "$file")" \
              -F "attachment=@${file}"
          done
          echo "release ${TAG} published with ${id}"
