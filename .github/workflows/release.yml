name: Release

# One responsibility: publish the GitHub release for the version tag. This
# workflow owns the push trigger and chains the two workflows: version tags the
# commit that already carries a locally bumped manifest, then release publishes
# that tag. Same run, no event-driven hand-off and no bot commit.
on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    uses: ./.github/workflows/version.yml

  release:
    needs: version
    if: needs.version.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build tarball
        run: npm pack
      - name: Record tarball SHA-256
        run: |
          echo '### Tarball SHA-256' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          sha256sum *.tgz >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sha256sum *.tgz
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: '*.tgz'
